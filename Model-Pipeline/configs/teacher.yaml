# Distillate teacher configuration.
# Every tunable value for teacher labeling lives here; code must not hard-code any of these.
# Prompt text is versioned in src/teacher/prompts.py, not here, because changing it
# changes prompt_version (docs/teacher_prompts_and_shard_spec.md).

seed: 42

labels: [toxicity, severe_toxicity, obscene, threat, insult, identity_attack]

model:
  model_id: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554   # pinned Oct 17, 2026
  dtype: half                                          # T4 has no bf16
  max_model_len: 3072

data:
  # Same rows and ids as TFDS wikipedia_toxicity_subtypes/EnglishSubtypes:0.3.1, whose
  # download source now returns 403. Accept the competition rules on Kaggle once.
  kaggle_competition: jigsaw-toxic-comment-classification-challenge
  expected_rows: {train: 159571, test: 63978}
  files: {train: wiki_train_raw.parquet, test: wiki_test_raw.parquet}
  manifest: data_manifest.json

# Relative to Model-Pipeline/. data_dir holds a local copy of 00_prepare_data's wiki/ output
# (gitignored); pilot_dir holds the committed pilot sample, few-shot ids, and baseline results.
paths:
  data_dir: data
  pilot_dir: artifacts/pilot
  injection_set: configs/injection_set.csv   # 40 synthetic comments, no real data
  shift_dir: artifacts/shift                 # Civil Comments shift sample ids and results

prompt:
  protocol: null            # p2 or p1; set by the decision memo
  shots: null               # zs or fs; set by the decision memo
  comment_max_tokens: 1024
  fewshot_max_tokens: 60

scoring:
  logprobs: 20
  min_coverage: 0.5
  max_retries: 1

sampling:
  pilot_size: 2000
  pilot_enrich: {threat: 150, identity_attack: 150, severe_toxicity: 150}
  fewshot_per_label: 2      # spec allows 2 to 3; 3 nearly fills max_model_len
                            # examples must fit prompt.fewshot_max_tokens, so none is cut
  gate_subset_size: 20000

baseline:
  model_version: tfidf-lr-v1
  word_ngram_range: [1, 2]
  char_ngram_range: [3, 5]
  max_features: 200000      # per vectorizer
  C: 4.0

metrics:
  ece_bins: 10              # equal-width bins over [0, 1]

calibration:
  version: platt-v1         # weighted Platt scaling on logit_<label>, never on logit(p)
  folds: 5                  # cross-fitting, for the ECE after calibration

injection:
  threshold: 0.5            # flip = the yes/no decision at this threshold changes

stack:
  version: stack-v1         # logistic regression on logit_<label> and TF-IDF's logit(p)
  C: 1.0

# Civil Comments shift check (shift.py). Hugging Face copy, as TFDS's download returns 403.
shift:
  dataset: google/civil_comments
  revision: f2970eb3a55777454c94069077cc8d9b5866312d   # pinned Oct 18, 2026
  split: validation
  file: data/validation-00000-of-00001.parquet
  threshold: 0.5            # positive when at least half the raters chose the label
  size: 3000
  enrich: {threat: 200, obscene: 300, identity_attack: 300}
  prompt_version: p2-zs-v1  # the teacher configuration the stack uses

labeling:
  shard_size: 5000
  stop_after_hours: 11

storage:
  backend: hf               # switch to gcs once the bucket exists (implementation plan, Part 1.1)
  hf_repo: N-S-10/distillate-teacher-shards
  gcs_bucket: null          # <team>-distillate-data, from Vaishnavi
