# The demo app's Cloud Run service (work plan v5, section 6): its own service, with session
# affinity. deploy_frontend.sh fills the ${...} fields (render_service.py) and applies it with
# `gcloud run services replace`; an unfilled field stops the deploy.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE}
  labels:
    cloud.googleapis.com/location: ${REGION}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Streamlit keeps one websocket per visitor: affinity sends a visitor's reconnects to
        # the same instance, where their session state lives.
        run.googleapis.com/sessionAffinity: "true"
        # Cloud Storage volumes need the second-generation execution environment.
        run.googleapis.com/execution-environment: gen2
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      # A websocket is one request: the default 300 s would cut every visitor off after 5
      # minutes. 3600 s is Cloud Run's maximum.
      timeoutSeconds: 3600
      containerConcurrency: 80
      containers:
        - image: ${IMAGE}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /_stcore/health
            periodSeconds: 5
            failureThreshold: 12
          env:
            - name: DISTILLATE_API_URL
              value: "${API_URL}"
            - name: MLFLOW_TRACKING_URI
              value: "${MLFLOW_TRACKING_URI}"
            - name: MLFLOW_TRACKING_USERNAME
              value: "${MLFLOW_TRACKING_USERNAME}"
            - name: MLFLOW_TRACKING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${MLFLOW_SECRET}
                  key: latest
            - name: DEPLOYMENTS_LOG
              value: /mnt/deployments/deployments.jsonl
            # retrain_dag writes its records under deployments/retrain/, inside the same mount.
            - name: RETRAIN_RECORDS
              value: /mnt/deployments/retrain
            - name: GRAFANA_URL
              value: "${GRAFANA_URL}"
          volumeMounts:
            - name: deployments
              mountPath: /mnt/deployments
              readOnly: true
      volumes:
        # Only the bucket's deployments/ folder (deploy.sh's deployments.jsonl, #64), read-only.
        # The bucket also holds data; the service account can read only this prefix
        # (setup_frontend.sh).
        - name: deployments
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: true
            volumeAttributes:
              bucketName: ${BUCKET}
              mountOptions: only-dir=deployments
