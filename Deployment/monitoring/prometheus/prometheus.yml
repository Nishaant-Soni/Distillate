# Prometheus config for drafting the dashboards against the mock (docker-compose.yml here).
# Phase 3 replaces the scrape target with the Cloud Run sidecar -> Managed Service for
# Prometheus path (v4 section 6); the rule file stays the same.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # The active rules only. alert_rules_planned.yml (Phase 3) is not loaded: its rules need
  # metrics nothing emits yet, or the int8 package's latency (see that file's header).
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: distillate
    metrics_path: /metrics
    static_configs:
      # The mock runs on the host (python mock_service.py --host 0.0.0.0 --port 8000);
      # host.docker.internal reaches it from the Prometheus container on Docker Desktop.
      - targets: ["host.docker.internal:8000"]
