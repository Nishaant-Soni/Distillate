# The training image (Model-Pipeline/Dockerfile), built from a clean checkout and checked inside.
# The build installs CUDA torch (several GB), so it runs only when the image can change: the
# Dockerfile and its build context rules, the requirements, src/pipeline/, or this workflow;
# and on every push to main that touches them.
name: model-pipeline-image

on:
  pull_request:
    paths:
      - "Model-Pipeline/Dockerfile"
      - "Model-Pipeline/Dockerfile.dockerignore"
      - "Model-Pipeline/requirements*.txt"
      - "Model-Pipeline/src/pipeline/**"
      - ".github/workflows/model-pipeline-image.yml"
  push:
    branches: [main]
    paths:
      - "Model-Pipeline/Dockerfile"
      - "Model-Pipeline/Dockerfile.dockerignore"
      - "Model-Pipeline/requirements*.txt"
      - "Model-Pipeline/src/pipeline/**"
      - ".github/workflows/model-pipeline-image.yml"
  workflow_dispatch:

concurrency:
  group: model-pipeline-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: training-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the CUDA torch wheel is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build
        run: docker build -f Model-Pipeline/Dockerfile -t distillate-train .

      - name: Container checks (code commit, tracked files only, DVC by revision)
        run: |
          docker run --rm --entrypoint python distillate-train \
            -m src.pipeline.container_check --expect-commit "${{ github.sha }}"

      - name: Smoke tests in the container
        run: docker run --rm --entrypoint python distillate-train -m pytest tests/pipeline -q
