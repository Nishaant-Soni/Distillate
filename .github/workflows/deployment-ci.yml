# Deployment CI: lint and tests for Deployment/ on every PR that touches it (work plan v5, 6).
# Owner: Ruchita. Location: .github/workflows/deployment-ci.yml
#
# Covers each Deployment/ component that exists: serving/, deploy/, frontend/. A component
# that isn't there yet is skipped, so this runs from day one. Deployment/monitoring/ has its own
# workflow (monitoring-ci.yml, Sai), so it is excluded here to avoid running the same tests twice.
#
# Per component: install its requirements*.txt if it has one, ruff, and pytest on its tests/.
# Shell scripts in deploy/, plus setup_gcp.sh and ops/ (setup-scripts job), are checked with
# bash -n and shellcheck.
name: deployment-ci

on:
  pull_request:
    paths:
      - "Deployment/**"
      - "!Deployment/monitoring/**"
      - ".github/workflows/deployment-ci.yml"
  push:
    branches: [main]
    paths:
      - "Deployment/**"
      - "!Deployment/monitoring/**"
      - ".github/workflows/deployment-ci.yml"

concurrency:
  group: deployment-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [serving, deploy, frontend]
    defaults:
      run:
        working-directory: Deployment
    steps:
      - uses: actions/checkout@v4

      - name: Check the component exists
        id: present
        run: |
          if [ -d "${{ matrix.component }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Deployment/${{ matrix.component }} doesn't exist yet; skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.present.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.present.outputs.present == 'true'
        working-directory: Deployment/${{ matrix.component }}
        run: |
          python -m pip install --upgrade pip
          shopt -s nullglob
          for req in requirements*.txt; do
            echo "Installing $req"
            pip install -r "$req"
          done
          pip install pytest==9.2.0 ruff==0.17.6

      - name: Lint (ruff)
        if: steps.present.outputs.present == 'true'
        working-directory: Deployment/${{ matrix.component }}
        run: ruff check .

      - name: Shell scripts (bash -n, shellcheck)
        if: steps.present.outputs.present == 'true'
        working-directory: Deployment/${{ matrix.component }}
        run: |
          shopt -s nullglob globstar
          scripts=(**/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts."
            exit 0
          fi
          for s in "${scripts[@]}"; do bash -n "$s"; done
          shellcheck "${scripts[@]}"

      - name: Tests (pytest)
        if: steps.present.outputs.present == 'true'
        working-directory: Deployment/${{ matrix.component }}
        run: |
          if [ ! -d tests ]; then
            echo "No tests/ folder yet."
            exit 0
          fi
          python -m pytest tests -v || [ $? -eq 5 ]

  # setup_gcp.sh and the ops VM's scripts sit outside the components above.
  setup-scripts:
    name: setup scripts (bash -n, shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Deployment
    steps:
      - uses: actions/checkout@v4
      - name: bash -n and shellcheck
        run: |
          shopt -s nullglob
          scripts=(*.sh ops/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts."
            exit 0
          fi
          for s in "${scripts[@]}"; do bash -n "$s"; done
          shellcheck "${scripts[@]}"
