# Model-Pipeline CI: lint and tests (teacher and student lanes) on every PR and push to main.
# Same shape as data-pipeline-ci.yml. The student smoke tests train a tiny offline model on
# synthetic data, so no network, GPU, or secrets are needed.
name: model-pipeline-ci

on:
  pull_request:
    paths: ["Model-Pipeline/**", ".github/workflows/model-pipeline-ci.yml"]
  push:
    branches: [main]
    paths: ["Model-Pipeline/**", ".github/workflows/model-pipeline-ci.yml"]

concurrency:
  group: model-pipeline-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Model-Pipeline

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Model-Pipeline/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch first, so requirements.txt does not pull the CUDA build.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests (pytest)
        run: pytest -q

  # The training image (Model-Pipeline/Dockerfile), built from this clean checkout, then checked
  # inside: git and DVC work for the non-root user, no untracked file (data, keys) is in it, and
  # the pipeline's smoke tests pass in the container (CPU, offline).
  image:
    name: training-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the CUDA torch wheel is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build
        run: docker build -f Model-Pipeline/Dockerfile -t distillate-train .

      - name: Container checks (code commit, tracked files only, DVC by revision)
        run: |
          docker run --rm --entrypoint python distillate-train \
            -m src.pipeline.container_check --expect-commit "${{ github.sha }}"

      - name: Smoke tests in the container
        run: docker run --rm --entrypoint python distillate-train -m pytest tests/pipeline -q
