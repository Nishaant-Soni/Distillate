# Data-Pipeline CI: lint and tests on every PR and every push to main.
# Owner: Ruchita. 
name: data-pipeline-ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: data-pipeline-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Data-Pipeline

env:
  PYTHONPATH: ${{ github.workspace }}/Data-Pipeline

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Use the team requirements once Vaishnavi's file has content;
          # until then, install the minimum the Phase 1 scripts and tests need.
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "Data-Pipeline/requirements.txt missing or empty; installing minimal set"
            pip install pandas pyarrow scikit-learn fairlearn pyyaml
          fi
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: |
          code=0
          pytest -q || code=$?
          # Exit code 5 means no tests were collected yet; don't fail the build for that.
          if [ "$code" = "5" ]; then
            echo "No tests collected yet."
            exit 0
          fi
          exit $code

  tf-tests:
    name: tf-tests (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TensorFlow environment
        id: install
        run: |
          if [ ! -s requirements-tf.txt ]; then
            echo "requirements-tf.txt not present yet; skipping TF tests."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m pip install --upgrade pip
          pip install -r requirements-tf.txt pytest

      - name: Tests including TFDV (pytest)
        if: steps.install.outputs.skip != 'true'
        run: |
          code=0
          pytest -q || code=$?
          if [ "$code" = "5" ]; then
            echo "No tests collected yet."
            exit 0
          fi
          exit $code
