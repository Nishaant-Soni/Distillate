# Distillate data pipeline configuration.
# Every tunable value lives here; scripts must not hard-code any of these.
# If a change affects another lane, update CONTRACTS.md in the same PR.

seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  schema_dir: data/schema
  reports_dir: reports
  summaries_dir: reports/summaries
  identity_terms: config/identity_terms.txt
  civil_exclude_ids: config/civil_teacher_shift_ids.txt   # teacher prompt-selection rows
  kaggle_dir: data/kaggle           # Kaggle downloads (git-ignored, not versioned)
  cache_dir: data/cache             # full Civil train (1.8M rows): untracked, not in DVC

datasets:
  wikipedia:
    kaggle_competition: jigsaw-toxic-comment-classification-challenge
    kaggle_files: {train: train.csv.zip, test: test.csv.zip, test_labels: test_labels.csv.zip}
    splits: [train, test]
    expected_rows: {train: 159571, test: 63978}
  civil_comments:
    kaggle_competition: jigsaw-unintended-bias-in-toxicity-classification
    kaggle_files:
      train: train.csv
      validation: test_public_expanded.csv
      test: test_private_expanded.csv
    splits: [train, validation, test]
    expected_rows: {train: 1804874, validation: 97320, test: 97320}
  civil_identities:
    # Built from civil_comments test: rows with identity_annotator_count > 0.
    splits: [test]
    expected_rows: {test: 21577}

acquire:
  csv_chunksize: 200000             # rows per chunk when reading the big Civil CSVs

labels:
  names: [toxicity, severe_toxicity, obscene, threat, insult, identity_attack]
  civil_positive_threshold: 0.5
  civil_dropped_labels: [sexual_explicit]

preprocess:
  max_char_len_flag: 5000
  obfuscation_nonalpha_share: 0.3   # confirmed in EDA: flags 1.9% of Wikipedia train
  batch_size: 200000                # rows per chunk when cleaning Civil train

dedupe:
  jaccard_threshold: 0.9
  shingle_words: 3
  minhash_num_perm: 128
  lsh_bands: null                   # tuned in the Gantt optimization step

splits:
  val_fraction: 0.15
  canary_wikipedia_size: 2000
  civil:
    h2_size: 10000
    canary_size: 4000
    drift_total: 40000
    drift_batches: 20
  obfuscation_size: 3000

validation:
  raw_civil_stats_sample: 100000
  max_missing_fraction: 0.001       # above this fails; below warns and drops
  prevalence_tolerance_pts: 1.0

bias:
  min_slice_size: 100
  fpr_flag_margin_pts: 5.0
  reweight_factors: [1, 2, 3, 5]
  max_auc_drop: 0.005
  label: toxicity                   # the baseline scores this label only; the factor is chosen on it
  # Civil slices are reported for each of these the prediction file scores.
  # severe_toxicity is left out: almost no Civil rows are positive at >= 0.5.
  civil_labels: [toxicity, obscene, threat, insult, identity_attack]
  data_gap_flag_pts: 15.0           # data level: a slice's toxic rate this far above overall is reported
  identity_threshold: 0.5           # Civil identity attribute >= this puts a row in the slice
  length_bands: [100, 500]          # Wikipedia val bands: <100, 100-499, 500+ characters
  tfidf: {max_features: 50000, ngram_max: 2, min_df: 2}
  logreg: {C: 4.0, max_iter: 1000}


dvc:
  push: true                        # overridden by the DVC_PUSH env var

stubs:
  # Rows each placeholder stage writes until the real module is merged. Small on
  # purpose: the point is that the DAG runs end to end in seconds, not that the
  # numbers mean anything. Has no effect once a stage has a real run().
  rows: 200


teacher:
  # Phase 2: validate_teacher_shards and merge_teacher_labels. Paths are relative to Data-Pipeline/.
  model_pipeline_dir: ../Model-Pipeline        # the teacher lane's validator is reused from here
  backend: gcs                                 # gcs (gs://distillate-mlops-data) or hf (backup)
  local_root: null                             # a local copy of the store instead (tests)
  required: false                              # if the store can't be reached: warn and skip
  report: reports/teacher/validation.json
  plan: ../Model-Pipeline/artifacts/teacher_shards.json
  shard_size: null                             # null: the teacher config's (5,000); tests use 10
  kinds:                                       # what each kind of shard must look like
    teacher:                                   # raw Qwen; model_version comes from the teacher config
      model_version: null
    soft:                                      # stack-v1 soft labels, the student's targets
      model_version: "stack-v1+Qwen/Qwen3-4B-Instruct-2507@cdbee75f17c01a7cc42f958dc650907174af0554+tfidf-lr-v1"
      hash_field: stack_sha256
      hash_file: ../Model-Pipeline/artifacts/stack/stack_p2-zs-v2b.json
    calqwen:                                   # calibrated Qwen, the ablation's attribution arm
      model_version: "calqwen-v1+Qwen/Qwen3-4B-Instruct-2507@cdbee75f17c01a7cc42f958dc650907174af0554"
      hash_field: calibration_sha256
      hash_file: ../Model-Pipeline/artifacts/pilot/calibration_p2-zs-v2b.json
  sources:                                     # the id lists each run is checked against
    train: data/raw/wikipedia/train.parquet
    gate: ../Model-Pipeline/artifacts/gate_subset_ids.parquet
    drift: data/splits/civil_drift_ids.csv
  runs:
    - {prefix: teacher/p2-zs-v2b/, source: train, kind: teacher}
    - {prefix: teacher/p2-zs-v2b/gate/, source: gate, kind: teacher}
    - {prefix: teacher/p2-zs-v2b/drift/, source: drift, kind: teacher}
    - {prefix: soft_labels/stack-v1/p2-zs-v2b/, source: train, kind: soft}
    - {prefix: soft_labels/stack-v1/p2-zs-v2b/gate/, source: gate, kind: soft}
    - {prefix: soft_labels/stack-v1/p2-zs-v2b/drift/, source: drift, kind: soft}
    - {prefix: soft_labels/calqwen-v1/p2-zs-v2b/, source: train, kind: calqwen}
    - {prefix: soft_labels/calqwen-v1/p2-zs-v2b/gate/, source: gate, kind: calqwen}

  merge:                                       # merge_teacher_labels: the training table
    output: data/processed/teacher_labels.parquet
    teacher_version: stack-v1
    soft: soft_labels/stack-v1/p2-zs-v2b/      # -> p_<label>, the student's targets
    raw: teacher/p2-zs-v2b/                    # -> p_<label>_raw
    calqwen: soft_labels/calqwen-v1/p2-zs-v2b/ # -> p_<label>_calqwen (null to leave it out)
    tfidf: tfidf/tfidf-lr-v1-oof/tfidf_oof.parquet          # -> tfidf_oof_<label>
    tfidf_manifest: ../Model-Pipeline/artifacts/oof/tfidf_oof.manifest.json
